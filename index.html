<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍉 西瓜多階段計時推播</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 480px; margin: 0 auto; line-height: 1.5; background-color: #fafafa; color: #333; }
    .watermelon-box { text-align: center; margin: 15px 0; padding: 15px; background: #fff0f3; border-radius: 16px; border: 2px dashed #ff4d6d; }
    .watermelon-icon { font-size: 64px; display: inline-block; animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1) rotate(5deg); } 100% { transform: scale(1); } }
    
    /* ⏱️ 畫面倒數計時器樣式 */
    .timer-display { background: #222; color: #00ff66; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; font-family: monospace; display: none; }
    .timer-time { font-size: 36px; font-weight: bold; }
    .timer-status { font-size: 14px; color: #aaa; margin-top: 5px; }

    .stage-card { display: flex; align-items: center; justify-content: space-between; background: #ffffff; padding: 12px 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .stage-label { font-weight: bold; color: #2d6a4f; }
    .stage-input-group { display: flex; align-items: center; gap: 8px; }
    input[type="number"] { width: 65px; padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; text-align: center; }
    button { padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #007aff; color: white; width: 100%; margin-bottom: 15px; }
    .btn-add { background: #d8f3dc; color: #1b4332; width: 100%; margin-bottom: 15px; border: 1px solid #b7e4c7; }
    .btn-success { background: #ff4d6d; color: white; width: 100%; font-size: 18px; box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3); }
    .btn-delete { background: #ffccd5; color: #c9184a; padding: 6px 10px; font-size: 14px; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="watermelon-box">
    <div class="watermelon-icon">🍉</div>
    <h2 style="margin: 5px 0 0 0; color: #c9184a;">西瓜多階段計時器</h2>
  </div>

  <!-- 倒數計時顯示區塊 -->
  <div id="timer-box" class="timer-display">
    <div id="timer-status" class="timer-status">準備就緒</div>
    <div id="timer-time" class="timer-time">00:00</div>
  </div>

  <button id="enable-push" class="btn-primary">1. 允許通知權限</button>

  <div id="stages-container">
    <div class="stage-card">
      <span class="stage-label">階段 1</span>
      <div class="stage-input-group">
        <input type="number" class="stage-min" value="1" step="any" min="0.01"> 分鐘
        <button class="btn-delete" onclick="removeStage(this)">刪除</button>
      </div>
    </div>
  </div>

  <button id="add-stage" class="btn-add">➕ 新增階段</button>
  <button id="start-btn" class="btn-success">🚀 開始排程計時</button>

  <script>
    const VAPID_PUBLIC_KEY = 'BC59SnWYq7iGTi7tb1ify3lvkY9ji742Dt9vCEsftJqyNhlPFPamGQtKtH8OSwGSsPLMzCGPvbiNChYkZAz7Z6Q';
    
    // ⚠️ 請務必替換為你真實部署的 GAS 網址！
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwCMIQIdZzOa1q4knFt2yaehUrT6iMAzdDEhermdx20ELkklZfMBT4CYgD6-fqrpUM2kQ/exec';

    let pushSubscription = null;
    let countdownInterval = null;

    if ('serviceWorker' in navigator && 'PushManager' in window) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        console.log('SW 註冊成功:', reg);
      });
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
    }

    document.getElementById('enable-push').addEventListener('click', async () => {
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
        pushSubscription = sub;
        alert('✅ 推播權限設定成功！');
      } catch (err) {
        alert('❌ 訂閱失敗，請確保是從「主畫面 PWA」開啟');
        console.error(err);
      }
    });

    document.getElementById('add-stage').addEventListener('click', () => {
      const container = document.getElementById('stages-container');
      const div = document.createElement('div');
      div.className = 'stage-card';
      div.innerHTML = `
        <span class="stage-label">階段</span>
        <div class="stage-input-group">
          <input type="number" class="stage-min" value="5" step="any" min="0.01"> 分鐘
          <button class="btn-delete" onclick="removeStage(this)">刪除</button>
        </div>
      `;
      container.appendChild(div);
      updateStageNumbers();
    });

    function removeStage(btn) {
      btn.closest('.stage-card').remove();
      updateStageNumbers();
    }

    function updateStageNumbers() {
      const labels = document.querySelectorAll('.stage-label');
      labels.forEach((label, index) => {
        label.textContent = `階段 ${index + 1}`;
      });
    }

    // 前端即時畫面倒數邏輯
    function startLocalCountdown(stages) {
      if (countdownInterval) clearInterval(countdownInterval);
      
      const timerBox = document.getElementById('timer-box');
      const timerStatus = document.getElementById('timer-status');
      const timerTime = document.getElementById('timer-time');
      
      timerBox.style.display = 'block';
      
      let currentStageIndex = 0;
      let secondsLeft = Math.round(stages[0] * 60);

      function updateDisplay() {
        const mins = Math.floor(secondsLeft / 60);
        const secs = secondsLeft % 60;
        timerTime.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        timerStatus.textContent = `⏳ 階段 ${currentStageIndex + 1} 進行中 (共 ${stages.length} 階段)`;
      }

      updateDisplay();

      countdownInterval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft < 0) {
          currentStageIndex++;
          if (currentStageIndex < stages.length) {
            secondsLeft = Math.round(stages[currentStageIndex] * 60);
            updateDisplay();
          } else {
            clearInterval(countdownInterval);
            timerStatus.textContent = '🎉 全部階段計時結束！';
            timerTime.textContent = '00:00';
          }
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    document.getElementById('start-btn').addEventListener('click', async () => {
      if (!pushSubscription) {
        alert('請先點擊「允許通知權限」！');
        return;
      }

      const inputs = document.querySelectorAll('.stage-min');
      const stages = Array.from(inputs).map(i => parseFloat(i.value)).filter(val => val > 0);

      if (stages.length === 0) {
        alert('請至少新增一個有效階段！');
        return;
      }

      const payload = { subscription: pushSubscription, stages: stages };
      const formData = new FormData();
      formData.append('data', JSON.stringify(payload));

      try {
        await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: formData });
        
        // 啟動前端畫面倒數動畫
        startLocalCountdown(stages);
        
        alert('🍉 計時已排定！畫面上將顯示倒數，時間到後端也會跳出推播與震動。');
      } catch (err) {
        alert('❌ 排程失敗：' + err.message);
      }
    });
  </script>
</body>
</html>
